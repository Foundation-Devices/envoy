name: Auto-increment Build Number

on:
  pull_request:
    types:
      - opened

jobs:
  bump-version:
    # Fork PRs get a read-only token and could not push the bump anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Increment build number
        run: |
          # The version line is PR-controlled: only a complete X.Y.Z+N line is
          # rewritten, with the same grammar as scripts/bump_version.sh, and
          # nothing from it reaches shell evaluation.
          perl -i -pe 's/^(version:\s+\d+\.\d+\.\d+\+)(\d{1,9})$/$1.($2+1)/e' pubspec.yaml
          if git diff --quiet -- pubspec.yaml; then
            echo "::error::pubspec.yaml has no plain 'version: X.Y.Z+N' line"
            exit 1
          fi
          grep '^version:' pubspec.yaml

      - name: Commit and push
        env:
          # Branch names may contain shell syntax; pass it as data.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pubspec.yaml
          git commit -m "chore: bump build number"
          git push origin "HEAD:refs/heads/${HEAD_REF}"
