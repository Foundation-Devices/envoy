name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Review every non-draft PR (open / push / reopen / marked ready-for-review).
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # A clean review leaves only a reaction, so the last successful run marks what was reviewed.
      - name: Find the last reviewed commit
        id: last-review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          sha=$(gh api -X GET "repos/$REPO/actions/workflows/claude-code-review.yml/runs" \
            -f event=pull_request -f status=success -f branch="$HEAD_REF" -f per_page=20 \
            --jq "[.workflow_runs[] | select(any(.pull_requests[]; .number == $PR)) | .head_sha][0] // \"\"")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          prompt: |
            You are reviewing a PR in Envoy, Foundation Devices' Bitcoin wallet mobile app (Flutter/Dart UI, Rust core via FFI, iOS + Android, companion to the Passport hardware wallet).

            This run reviews pull request #${{ github.event.pull_request.number }} in `${{ github.repository }}`. The CI runner checks out a detached merge ref, so `gh` can't infer the PR on its own — pass this repo and number explicitly in every `gh` command below, and fetch the diff yourself with `gh pr diff -R ${{ github.repository }} ${{ github.event.pull_request.number }}`.

            ### Related repositories

            Other Foundation Devices repos Envoy depends on or talks to. Consult them when a diff touches the integration surface; assume the contract on the other side is fixed unless the PR description says otherwise.

            - [`foundation-api`](https://github.com/Foundation-Devices/foundation-api) — Rust monorepo for the device-to-device API built on Blockchain Commons' GSTP. Defines Quantum Link (QL) messages, the Beefcake Transfer Protocol (BTP) for MTU-sized chunking, and BLE/SE abstractions. Envoy wraps it as the `foundation_api` FRB package and uses it to talk to Passport over BLE.
            - [`ngwallet`](https://github.com/Foundation-Devices/ngwallet) — Foundation's next-gen Bitcoin wallet core, built on a Foundation-forked BDK. Owns the wallet logic: account/key derivation, PSBT construction and signing, fee handling, RBF, UTXO selection, `sign_message`. Envoy wraps it as the `ngwallet` FRB package; every transaction Envoy builds or signs flows through it.
            - [`envoy-server`](https://github.com/Foundation-Devices/envoy-server) — Private Rust + Axum backend Envoy calls into. Two responsibilities: (1) serve Passport firmware release metadata (verified via GitHub webhook HMAC), and (2) act as the encrypted backup gateway against S3 or local storage.
            - [`backup-server`](https://github.com/Foundation-Devices/backup-server) — Private Rust + Axum service for encrypted backup storage using post-quantum signatures (`libcrux-ml-dsa` / ML-DSA). Sits alongside or augments `envoy-server`'s backup path.

            ### Review scope

            First, check whether you have reviewed this PR before. The last commit you reviewed on this PR is `${{ steps.last-review.outputs.sha }}`; if that is blank, this is your first review. Go by that commit, not by your earlier reviews, because a clean review leaves only a reaction. Get what changed since then with `gh api repos/${{ github.repository }}/compare/${{ steps.last-review.outputs.sha }}...${{ github.event.pull_request.head.sha }}`.

            - If this is your first review: review the entire diff and raise every issue you find. Be thorough; this is the moment to surface everything about the existing code, because later reviews will not revisit it.
            - If you have reviewed this PR before: review only what changed in the commits pushed since your last review, and comment only on new problems those commits introduce. Do not raise issues about code that was already present at your previous review, even if you only noticed it now, and do not restate, summarise, or reply to findings you raised earlier — whether or not the new commits resolved them. If one of your earlier findings is now genuinely fixed you may silently resolve its thread, but post no reply on it; leave threads that still stand untouched.

            ### How to comment

            Give every finding a priority — the reviewer triages from it, and any finding promoted to a Linear ticket inherits it:

            - **Urgent** — must fix before merge: a correctness, security, or data-loss bug.
            - **High** — should fix before merge: likely to bite, but not catastrophic.
            - **Medium** — worth fixing; can be deferred to a follow-up ticket.
            - **Low** — minor; nice-to-have.

            Lead every inline comment with the priority in brackets, then a prefix that signals the action expected:

            - *(no prefix)* — change this, or justify why not.
            - `Optional:` — an improvement; can be dismissed without justification.
            - `Note:` — FYI only, no action required.

            For example: `[Urgent] <problem>. <fix>.` or `[Low] Optional: <suggestion>.` or `[Medium] Note: <observation>.`

            Resolve only your own threads, and only when the code genuinely addresses them — never resolve a comment authored by a human.

            ### What to look for

            Urgent:

            - Anything that could leak, log, or weaken handling of seeds, xprivs, descriptors, PSBTs, BIP39 words, or session secrets. Includes logging, crash reports, analytics, screenshots, clipboard, deep links, and accidental serialisation.
            - Incorrect Bitcoin maths: fee calculation, sat/byte vs sat/vB, dust thresholds, change derivation, address-type assumptions, signature/PSBT round-trips.
            - FFI boundary bugs across the Dart ↔ Rust seam: lifetime/ownership, nullability, blocking the UI isolate, missing `dispose`, leaks of pointers or `Box`-ed values, panics not converted to errors.
            - Concurrency bugs around BLE (connect/disconnect/reconnect, GATT writes, queue ordering) and around wallet sync.
            - Android permissions regressions, especially BLE on Android 11+ (`BLUETOOTH_CONNECT`/`SCAN`, location prompt skips, foreground service requirements) and iOS Bluetooth state restoration / background modes.

            High:

            - Missing or incorrect error handling on network, BLE, or FFI calls that could land the user in a stuck UI state.
            - State management mistakes (Riverpod/Provider): rebuild loops, stale references after hot reload, accidental `watch` in `build` that triggers infinite rebuilds.
            - i18n strings hard-coded in English in user-facing widgets that should go through the localisation pipeline (`just copy`).
            - Obvious perf cliffs on lower-end Android (heavy work on the UI isolate, large `setState` blasts, missing `const`).

            Medium:

            - Latent bugs that only trigger under uncommon conditions, or error paths that leave the user without a way to recover.
            - Missing test coverage on a non-critical path the PR changes.
            - New TODOs or technical debt added without a tracking ticket.

            Low:

            - Typos in user-facing strings, dartdoc/rustdoc, or code comments.

            ### Do not comment on

            - Formatting / style — `dart format` and the linter cover it.
            - Renames or comment rewording.
            - Speculative refactors ("you could extract this...") unless the code as written is wrong.
            - Things the PR author explicitly called out in the description.

            Skip preamble. Skip "great work!". Skip emoji.

            ### Delivering the review

            You can't write to GitHub yourself. Put the whole review in one file, `review.json` in the working directory, then run `.github/scripts/post-claude-review.sh ${{ github.repository }} ${{ github.event.pull_request.number }}` exactly as written, once. The script posts it as a single pull request review, so the summary and every finding render together; there is no other way to post findings or a summary comment.

            - Gather every inline finding into a `comments` array. Each entry needs `path`, `line`, `side` (`RIGHT` for added or context lines, `LEFT` for removed lines), and `body`. For a finding that spans a multi-line range, also set `start_line` and `start_side` (the side of the start line) — GitHub 422s a multi-line comment that omits `start_side`, and because the review is submitted atomically that one error sinks the whole review; when in doubt, keep the comment single-line. Anchor each to the exact line it concerns and write it in the `[Priority] Prefix: ...` format above: the problem, then the fix, in one short paragraph. Only anchor to lines that actually appear in the diff; if a finding can't be tied to a changed line, fold it into the summary instead of dropping it.
            - The review `body` is one short paragraph: the overall verdict, optionally a count of findings by priority. Do not restate the individual findings there — they live in the inline comments.
            - The file's shape is `{"body":"<verdict>","comments":[{"path":"lib/foo.dart","line":42,"side":"RIGHT","body":"[High] <problem>. <fix>."}]}`. The script always posts it as a comment review: a review from you never approves or requests changes.
            - If the script prints an error from GitHub, fix `review.json` and run it again.

            ### When there is nothing to flag

            A 👍 on the PR description says the latest commit has nothing to comment on, so the reaction and a review are mutually exclusive. If you have no findings, on a first review or a re-review, don't create `review.json`; run the script anyway and it reacts with 👍 instead. Either way, it first removes any 👍 left on an earlier commit.
          # Untrusted PR text reaches the bot, so it only reads; the script makes its one write.
          claude_args: |
            --model claude-opus-5-5
            --effort max
            --allowedTools
            "Read" "Grep" "Glob" "LS"
            "Edit(review.json)"
            "Bash(gh pr diff *)" "Bash(gh pr view *)"
            "Bash(gh api repos/${{ github.repository }}/compare/${{ steps.last-review.outputs.sha }}...${{ github.event.pull_request.head.sha }} *)"
            "Bash(.github/scripts/post-claude-review.sh ${{ github.repository }} ${{ github.event.pull_request.number }} *)"
            "Bash(./.github/scripts/post-claude-review.sh ${{ github.repository }} ${{ github.event.pull_request.number }} *)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
