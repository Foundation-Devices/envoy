[workspace]
resolver = "2"
members = [
    "packages/http_tor/rust",
    "packages/ur/rust",
    "packages/backup/rust",
    "packages/shards/rust",
    "packages/foundation_api/rust",
    "packages/ngwallet/rust"
]
exclude = ["passport2/extmod/foundation-rust"]

[workspace.dependencies]

[patch.crates-io]
pqcrypto-traits = { git = "https://github.com/icota/pqcrypto", branch = "aarch64-feature-detection" }
pqcrypto-mldsa = { git = "https://github.com/icota/pqcrypto", branch = "aarch64-feature-detection" }
pqcrypto-mlkem = { git = "https://github.com/icota/pqcrypto", branch = "aarch64-feature-detection" }

[profile.release]
lto = true
codegen-units = 1
# Release artifacts are rebuilt by third parties, so they must not contain
# checkout-specific debug paths or depend on Cargo's incremental cache. The
# canonical builder remaps source paths, and Android strips device libraries
# while retaining a separate symbol table for crash reports.
debug = true
incremental = false
