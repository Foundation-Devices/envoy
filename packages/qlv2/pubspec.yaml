name: qlv2
description: QL v2 Flutter Rust Bridge package.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  rust_lib_qlv2:
    path: rust_builder
  flutter_rust_bridge: 2.11.1
  freezed_annotation: 3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.0
  freezed: ^3.2.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
